spring:
  application:
    name: arrima
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Our tables live in their own schema so Supabase's Data API (which exposes "public") cannot reach them.
      schema: arrima
      # Render's free instance has 0.1 CPU and the Supabase session pooler limits clients: a small pool is enough.
      maximum-pool-size: 5
      minimum-idle: 1

  flyway:
    schemas: arrima
    default-schema: arrima
    create-schemas: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  threads:
    virtual:
      enabled: true

  servlet:
    multipart:
      # Photos are compressed in the browser first; ImageValidator applies the real limit.
      max-file-size: 4MB
      max-request-size: 5MB

server:
  # Render injects PORT; 8080 is the local default.
  port: ${PORT:8080}
  # Render terminates TLS and forwards X-Forwarded-* headers from its internal proxy.
  forward-headers-strategy: native
  shutdown: graceful
  # JSON compresses ~10x: a melee view of 40 players goes from ~20 KB to ~2 KB on a weak signal.
  compression:
    enabled: true
    mime-types: application/json,application/problem+json
    min-response-size: 1KB

# Values come from environment variables (Render in production, backend/.env with the "local" profile).
arrima:
  security:
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl: 15m
    refresh-token-ttl: 60d
    refresh-reuse-grace: 60s
    cookie-secure: true
  storage:
    provider: ${STORAGE_PROVIDER:supabase}
    local-directory: .local-files
    supabase-url: ${SUPABASE_URL:}
    supabase-key: ${SUPABASE_SECRET_KEY:}
    bucket: ${SUPABASE_BUCKET:arrima}
  mail:
    provider: ${MAIL_PROVIDER:brevo}
    brevo-api-key: ${BREVO_API_KEY:}
    sender-email: ${MAIL_SENDER_EMAIL:}
    sender-name: ${MAIL_SENDER_NAME:Arrima}
    # Public address of the frontend (https://...), for the links inside the e-mails.
    app-url: ${APP_URL:}
