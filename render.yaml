# Render Blueprint: creates the backend web service (see README, "Despliegue").
services:
  - type: web
    name: arrima-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    # Deploy only after the GitHub Actions checks pass on main.
    autoDeployTrigger: checksPass
    # Changes outside backend/ (e.g. the frontend) do not redeploy the backend.
    buildFilter:
      paths:
        - backend/**
    envVars:
      # sync: false -> Render asks for the value when the Blueprint is created. Never put secrets here.
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Render generates a random 256-bit value itself: nobody ever needs to see or copy it.
      - key: JWT_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: arrima
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_SENDER_EMAIL
        sync: false
      - key: MAIL_SENDER_NAME
        value: Arrima
      # The frontend's address (https://...vercel.app), for the links in the e-mails.
      - key: APP_URL
        sync: false
      # Web Push for the match timer: generate the pair with scripts/generate-vapid-keys.sh.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      # Contact for the push services (Google, Apple...), e.g. mailto:you@example.com
      - key: VAPID_SUBJECT
        sync: false
