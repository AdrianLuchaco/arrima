name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Unit and integration tests; Testcontainers uses the runner's Docker.
      - run: ./mvnw -B verify
      # When something fails, each failed test (or a crashed test JVM) becomes an annotation of
      # the run, so it shows up on the commit without digging through the whole log.
      - name: Report failed tests
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob
          import xml.etree.ElementTree as ET

          def clean(text):
              return ' '.join((text or '').split())[:400].replace('%', '%25')

          def title(text):
              return clean(text).replace(':', '%3A').replace(',', '%2C')

          for path in sorted(glob.glob('target/surefire-reports/TEST-*.xml')):
              for case in ET.parse(path).getroot().iter('testcase'):
                  for problem in case.findall('failure') + case.findall('error'):
                      name = title(f"{case.get('classname')}.{case.get('name')}")
                      print(f"::error title={name}::{clean(problem.get('message') or problem.get('type'))}")
          for path in sorted(glob.glob('target/surefire-reports/*.dump*')):
              print(f"::error title={title(path)}::{clean(open(path, errors='replace').read())}")
          EOF

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The gitleaks binary, pinned and checked against its SHA-256. To update it, take the new
      # version's line for linux_x64.tar.gz from gitleaks_<version>_checksums.txt in its release.
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      # The whole history on every run, not only the new commits: a secret that was committed and
      # later deleted is still leaked.
      - name: Scan the whole history
        run: ./gitleaks git --redact --verbose --no-banner .
